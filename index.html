// ── Mulberry32 RNG：复刻 random.Random(seed) 行为 ──────
class Rng {
  constructor(seed) {
    let s = (seed >>> 0);
    if (s === 0) s = 0x9E3779B9;
    this.s = s;
  }
  _u32() {
    this.s = (this.s + 0x6D2B79F5) | 0;
    let t = Math.imul(this.s ^ (this.s >>> 15), 1 | this.s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  }
  random() { return this._u32() / 0x100000000; }
  choice(arr) { return arr[Math.floor(this.random() * arr.length)]; }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
}

// ── BenziGame：逐字对照 notebook.py Notebook 类 ─────────
class BenziGame {
  constructor(seed) {
    this.seed = (seed == null) ? Math.floor(Math.random() * 1e9) : seed;
    this.rng = new Rng(this.seed);
    this.round = 1;
    this.pos = "0,0";
    this.visited = new Set(["0,0"]);
    this.map_shown = false;
    this.pages = [{
      text: "醒来时你在门厅。本子只剩三页，写过的会被挤掉。",
      ink: 0, real: true, piece: false, echo: false,
      folded: false, ever_folded: false, full_text: null, gist: null,
    }];
    this.pieces = [];
    this.piece_ids = [];
    this.own_evicted = [];
    this.fake_pool = this.rng.shuffle(FAKES);

    // 原话散在门厅以外的屋子里，三张三间，互不重复
    const spots = Object.keys(ROOMS).filter(k => k !== "0,0");
    this.hidden = {};
    for (const q of PIECES) {
      const room = this.rng.choice(spots);
      const i = spots.indexOf(room);
      spots.splice(i, 1);
      this.hidden[room] = q;
    }

    this.over = null;
    this.hinted = false;
    this.door_hint = false;
    this.log = [];
    this.door_reached = 0;
    this.door_letter = 0;
    this.door_read = 0;
    this.wake_marks = { walk: 0, write: 0, copy: 0, verify: 0, unfold: 0 };
    this.unlocated = [];
    // 门缝：所有玩家共用的投递口（P0 原先关闭，现在接 Cloudflare Worker）
    this.door_seen = false;    // 「第一次走到后门」那段只读一次
    this.awaitingLeave = false; // 结局之后，输入框改成留话
    this.leaveDone = false;
    this._start = Date.now();
  }

  map_text() {
    const rows = [];
    for (const y of [2, 1, 0]) {
      const cells = [];
      for (const x of [0, 1, 2]) {
        const key = `${x},${y}`;
        const name = ROOMS[key][0];
        if (key === this.pos) cells.push(`<span class="here">●${name}</span>`);
        else if (this.visited.has(key)) cells.push(`<span class="seen">·${name}</span>`);
        else cells.push(`　？`);
      }
      rows.push(cells.join("　"));
    }
    return rows.join("\n");
  }

  // 折叠的大意：原文清洗后取前 12 字 + ……。截断不是概括，断在哪它不管。
  static _gist(text) {
    const clean = String(text).split(/\s+/).filter(Boolean).join(" ");
    return clean.slice(0, 12) + "……";
  }

  // 每 4 次醒来折一页：最旧、非原话、没折过的页。没有就跳过。
  foldOldest() {
    const idx = this.pages.findIndex(p => !p.piece && !p.ever_folded);
    if (idx === -1) return null;
    const p = this.pages[idx];
    p.folded = true;
    p.ever_folded = true;
    p.full_text = p.text;
    p.gist = BenziGame._gist(p.text);
    p.text = `（折起来的一页。大意：${p.gist}）`;
    this.log.push(["fold", this.round, idx + 1]);
    return idx;
  }

  // 假页 / 普通页推进；第 4、8、12 次醒来之后折一页
  next_round() {
    this.round += 1;
    if (this.round > WAKES) { this.over = "lose"; return; }
    if (this.round % 3 === 0 && this.fake_pool.length > 0) {
      const fake = this.fake_pool.pop();
      if (this.push(fake, { ink: 0, real: false })) {
        this.log.push(["fake", this.round]);
      }
    }
    // 假页之后再折，折的是「最旧的非原话、未折过的页」
    if (this.round % 4 === 0) {
      this.foldOldest();
    }
  }

  // 写一页。满了就挤掉最旧的非原话页；原话永远挤不掉。
  push(text, opts) {
    const ink = (opts && opts.ink !== undefined) ? opts.ink : this.round;
    const real = (opts && opts.real !== undefined) ? opts.real : true;
    const piece = (opts && opts.piece) || false;
    const echo = (opts && opts.echo) || false;
    if (this.pages.length >= PAGES) {
      const idx = this.pages.findIndex(p => !p.piece);
      if (idx === -1) return false;
      const gone = this.pages.splice(idx, 1)[0];
      this.log.push(["evict", gone.text, gone.real, gone.piece]);
      if (gone.real && !gone.piece && gone.ink !== 0) {
        this.own_evicted.push(gone.text);
      }
    }
    this.pages.push({
      text, ink, real, piece, echo,
      folded: false, ever_folded: false, full_text: null, gist: null,
    });
    return true;
  }

  move(d) {
    const [dx, dy] = ARROWS[d];
    const [px, py] = this.pos.split(",").map(Number);
    const nx = px + dx, ny = py + dy;
    const nk = `${nx},${ny}`;
    if (!ROOMS[nk]) {
      this._emit(`<span class="ev">那边没有门。</span>`);
      return false;
    }
    const revisit = this.visited.has(nk);
    this.pos = nk;
    this.visited.add(nk);
    this.wake_marks.walk += 1;
    this.log.push(["move", this.round]);
    const where = ROOMS[this.pos][0];
    this._emit(`你走到<span class="here">${where}</span>。`);
    if (revisit && !this.map_shown) {
      this.map_shown = true;
      this._emit(`<span class="ev">这间你来过。你翻开本子背面看了一眼：</span>`);
      this._emit(this.map_text());
    }
    if (this.pos === "2,2") {
      this.door_reached += 1;
      this.log.push(["door_reached", this.round]);
      if (!this.door_seen && DOOR_API) {
        this.door_seen = true;
        this.show_receipt_slot();
      }
    }
    return true;
  }

  // 第一次走到后门：门缝里那一叠纸
  async show_receipt_slot() {
    this._emit(`<span class="ev">你第一次走到后门，看见门缝下面塞着一叠纸，纸边露出来一截。</span>`);
    const r = await doorList(1);
    const line = r && r.items[0] ? r.items[0].line : null;
    const count = r ? r.count : 0;
    if (line) {
      this._emit(`<span class="ev">你抽出一张。上面写着一句：「${escapeHtml(line)}」</span>`);
      this._emit(`<span class="ev">这笔字可能是陌生的，也可能只是你忘了自己写过；句子里提到的那间屋，你今晚没去过——也可能是你去过，不记得。</span>`);
      this._emit(`<span class="ev">纸不旧。边上还有新折的痕迹——塞进来没多久。</span>`);
      if (count > 1) this._emit(`<span class="ev">（这叠纸里一共塞过 ${count} 张。想往前翻，在这里输入「门缝」。）</span>`);
    } else {
      this._emit(`<span class="ev">你第一次走到后门，看见门缝下面空着。纸边被磨得发毛 —— 这里常有人往里塞东西，又抽走。</span>`);
    }
  }

  // 在后门翻门缝：最近 N 张
  async showDoorHistory(n) {
    const r = await doorList(n);
    if (!r) { this._emit(`<span class="warn">门缝现在不通。（多半是网络问题，开代理/VPN 再试。）</span>`); return; }
    if (r.items.length === 0) {
      this._emit(`<span class="ev">你把那一叠纸翻到底。一张也没有。</span>`);
      return;
    }
    this._emit(`<span class="ev">你把门缝里那一叠翻过来，最近的几张：</span>`);
    r.items.forEach((it, i) => {
      this._emit(`<span class="ev">　${i + 1}. 「${escapeHtml(it.line)}」</span>`);
    });
    if (r.count > r.items.length) {
      this._emit(`<span class="ev">（共 ${r.count} 张，这里只翻最近的 ${r.items.length} 张。）</span>`);
    }
  }

  // 结局之后：留话。直接回车 = 不留。
  async submitLeave(raw) {
    if (this.leaveDone) return;
    this.leaveDone = true;
    this.awaitingLeave = false;
    let line = String(raw || "").replace(/[\r\n\t]/g, " ").trim();
    if (!line) {
      this._emit(`<span class="ev">你没留。门缝里的纸，还跟之前一样。</span>`);
      return;
    }
    if (line.length > 40) {
      this._emit(`<span class="ev">（你那句 ${line.length} 字，门缝只收得下 40 字——下面这句就是递给下一个人的样子：）</span>`);
      line = line.slice(0, 40);
      this._emit(`<span class="ev">　「${escapeHtml(line)}」</span>`);
    }
    const ok = await doorWrite(line);
    if (ok) {
      this._emit(`<span class="ev">你把纸折一下，塞进门缝。若走到后门，可能看到它；没走到，替写者也可能把它抄进本子。</span>`);
    } else {
      this._emit(`<span class="warn">塞不进去。这个门缝现在不通。（多半是网络问题，开代理/VPN 再试。）</span>`);
    }
  }

  write(text) {
    if (text.length > 60) {
      this._emit(`<span class="ev">太长了。本子只有三页，一页装不下六十个字以上。</span>`);
      return false;
    }
    if (!this.push(text)) {
      this._emit(`<span class="ev">本子满了。三页都被原话占着 —— 你在心里念了一遍，没地方写。</span>`);
      if (this.pages.every(p => p.piece)) {
        this.log.push(["full", this.round, text]);
      }
      return false;
    }
    this.wake_marks.write += 1;
    this.log.push(["write", this.round]);
    this._emit(`你写了一句。<span class="ev">墨迹：第 ${this.round} 次醒来。</span>`);
    return true;
  }

  copy() {
    if (!(this.pos in this.hidden)) {
      this._emit(`<span class="ev">这里没有纸可抄。</span>`);
      return false;
    }
    const piece = this.hidden[this.pos];
    if (!this.push(piece, { piece: true })) {
      this._emit(`<span class="ev">本子满了。三页都被原话占着 —— 你在心里念了一遍，没地方抄。</span>`);
      return false;
    }
    delete this.hidden[this.pos];
    this.pieces.push(piece);
    this.wake_marks.copy += 1;
    this.log.push(["copy", this.round]);
    this._emit(`<span class="piece">你把这句话抄进本子：</span>`);
    this._emit(`<span class="piece">　「${piece}」</span>`);
    this._emit(`<span class="ev">（这一页挤不掉。它不是笔记，是原话。）</span>`);
    if (this.pieces.length >= PIECES_NEEDED && !this.door_hint) {
      this.door_hint = true;
      this._emit(`<span class="old">三张都齐了。回门厅之前记着：那扇门认纸，也认墨迹 —— 你得亲手验过一页。</span>`);
    }
    return true;
  }

  verify(i) {
    if (!(1 <= i && i <= this.pages.length)) {
      this._emit(`<span class="ev">没有这一页。</span>`);
      return false;
    }
    const p = this.pages[i - 1];
    if (p.folded) {
      this._emit(`<span class="ev">你验这一页。手指按上去，按到的是折痕，不是笔画。</span>`);
      this._emit(`<span class="ev">折着，验不了。</span>`);
      this._emit(`<span class="ev">（没花醒来）</span>`);
      return false;
    }
    if (!p.real) {
      this._emit(`<span class="warn">这一页的墨迹是新的，而且没有编号。不是你写的。</span>`);
      this.pages.splice(i - 1, 1);
      this._emit(`<span class="ev">你把它撕了下来，夹在指缝里。腾出一页。</span>`);
      this.log.push(["caught", i, p.text]);
    } else if (p.piece) {
      this._emit(`<span class="piece">是原话。原话不用编号，它自己站得住。</span>`);
    } else if (p.ink === 0) {
      this._emit(`<span class="old">这一页的墨迹是旧的，没有编号。上一轮的你在门厅写的。</span>`);
    } else {
      this._emit(`<span class="piece">墨迹：第 ${p.ink} 次醒来。是你。</span>`);
    }
    this.wake_marks.verify += 1;
    this.log.push(["check", i]);
    return true;
  }

  verified() {
    return this.log.some(e => e[0] === "check" || e[0] === "caught");
  }

  // 展开折起页：花 1 次醒来，恢复原文（acted 流程会推进回合）
  unfold(i) {
    if (!(1 <= i && i <= this.pages.length)) {
      this._emit(`<span class="ev">没有这一页。</span>`);
      return false;
    }
    const p = this.pages[i - 1];
    if (!p.folded) {
      this._emit(`<span class="ev">这一页没有折。</span>`);
      return false;
    }
    p.folded = false;
    p.text = p.full_text;
    this.wake_marks.unfold += 1;
    this.log.push(["unfold", i]);
    this._emit(`<span class="ev">你花一次醒来，把折痕抹开。</span>`);
    this._emit(`<span class="ev">字回来了，一个不少。折痕留着，横在页面中间，像一道旧疤。</span>`);
    return true;
  }

  // 没记：免费、不推进、最多 5 条（超出挤最早）
  noteUnlocated(text) {
    if (!text) {
      this._emit(`<span class="ev">没记什么？没记 <一句话>。</span>`);
      return false;
    }
    if (this.unlocated.length >= 5) {
      this.unlocated.shift();
      this._emit(`<span class="ev">未定位最多五条，最早的一条被挤掉了。</span>`);
    }
    this.unlocated.push(text.slice(0, 60));
    this._emit(`<span class="ev">你把它写下手边那张纸。不写进本子。未定位 ${this.unlocated.length} 条。</span>`);
    return true;
  }

  // 当前幕：1 醒来 / 2 发现替写 / 3 集原话回门厅
  act() {
    if (this.pieces.length >= PIECES_NEEDED) return 3;
    if (this.round >= 3) return 2;
    return 1;
  }

  check_end() {
    if (this.pieces.length >= PIECES_NEEDED && this.pos === "0,0") {
      if (this.verified()) {
        this.over = "win";
      } else if (!this.hinted) {
        this.hinted = true;
        this._emit(`<span class="ev">三个槽对齐了，门没开。锁上还有一道：你得亲手验过一页墨迹。</span>`);
      }
    }
  }

  counts() {
    const caught = this.log.filter(e => e[0] === "caught");
    const fakes = this.log.filter(e => e[0] === "fake");
    const writes = this.log.filter(e => e[0] === "write");
    const full = this.log.filter(e => e[0] === "full");
    const evicts = this.log.filter(e => e[0] === "evict");
    return { caught, fakes, writes, full, evicts };
  }

  ending() {
    const { caught, fakes, writes, full } = this.counts();
    if (this.over === "win") {
      return writes.length > 0 ? "A" : "B";
    }
    if (this.pages.some(p => !p.real)) return "C";
    if (this.pieces.length >= PIECES_NEEDED && this.pos !== "0,0") {
      return full.length > 0 ? "F" : "E";
    }
    if (this.pieces.length < PIECES_NEEDED
        && this.pages.every(p => p.real)
        && caught.length > 0) return "D";
    return "G";
  }

  ending_text(code) {
    const { caught, fakes, writes, full, evicts } = this.counts();
    const room = ROOMS[this.pos][0];
    const vals = {
      wakes: WAKES,
      room,
      pieces: this.pieces.length,
      own_pages: this.pages.filter(p => p.real && !p.piece).length,
      caught: caught.length,
      fakes: fakes.length,
      steps: Math.abs(parseInt(this.pos.split(",")[0]))
           + Math.abs(parseInt(this.pos.split(",")[1])),
    };
    let template = ENDINGS[code];
    if (code === "A") {
      const own = this.own_evicted.length > 0
        ? this.own_evicted[this.own_evicted.length - 1]
        : (evicts.filter(e => e[2] && !e[3]).map(e => e[1])[0] || "（读不出来了）");
      vals.evicted_own = own;
    } else if (code === "C") {
      // 优先级：折起页 > 第一个 not real 页（回声未实现）
      // 只把「折起的非原话页」当 C 的展示页：C_FOLD 说的是不是你写的字。
      let foldIdx = -1;
      for (let i = 0; i < this.pages.length; i++) {
        if (this.pages[i].folded && !this.pages[i].real) { foldIdx = i + 1; break; }
      }
      let idx = -1;
      if (foldIdx !== -1) {
        template = C_FOLD;
        idx = foldIdx;
        const fp = this.pages[idx - 1];
        vals.gist = fp.gist || BenziGame._gist(fp.full_text || fp.text);
      } else {
        for (let i = 0; i < this.pages.length; i++) {
          if (!this.pages[i].real) { idx = i + 1; break; }
        }
      }
      vals.page_no = idx;
      vals.page_text = this.pages[idx - 1].text;
      vals.finger_line = caught.length > 0
        ? `现在你合上本子。指缝里 ${caught.length} 张纸，都是你亲手撕的，没有一张是这一页。`
        : `现在你合上本子。指缝里没有纸 —— 你一页也没撕过。`;
    } else if (code === "D") {
      vals.caught_text = caught.length > 0 ? caught[caught.length - 1][2] : "";
      if (this.pages.length > 0) {
        vals.pages_line = `${vals.pieces} 页是你收进本子的原话，${vals.own_pages} 页是你自己的字。没有一页是别人替你写的。`;
      } else {
        vals.pages_line = "里面是空的，你一页都没给自己留。";
      }
    } else if (code === "E") {
      vals.walked = this.wake_marks.walk;
      vals.unfolded = this.wake_marks.unfold;
    } else if (code === "F") {
      vals.wanted = full.length > 0 ? full[full.length - 1][2] : "";
    } else if (code === "G") {
      const fake_evicted = evicts.filter(e => !e[2]);
      vals.evicted_fake = fake_evicted.length > 0
        ? fake_evicted[fake_evicted.length - 1][1] : "";
    }
    return template.map(ln => fmt(ln, vals));
  }

  report() {
    const { caught, fakes, evicts } = this.counts();
    const elapsed = Math.max(0, Math.floor((Date.now() - this._start) / 1000));
    return `这一局：原话 ${this.pieces.length}/${PIECES_NEEDED}　有人替你写过 ${fakes.length} 页　你验出来 ${caught.length} 页　挤掉 ${evicts.length} 页\n` +
           `未定位 ${this.unlocated.length} 条　用时 ${Math.floor(elapsed / 60)} 分 ${elapsed % 60} 秒`;
  }

  finish() {
    const code = this.ending();
    const isWin = (code === "A" || code === "B");
    const cls = isWin ? "end-win" : "end-lose";
    // 结局动画背景（替换场景）
    const sceneEl = document.getElementById("scene");
    if (sceneEl) {
      sceneEl.className = "scene end-" + code;
      sceneEl.innerHTML = `<span class="act-label">结局 · ${TITLES[code]}</span>` + endingAnim(code);
    }
    this._emit(`<div class="end-banner ${cls}">${TITLES[code]}</div>`);
    // 逐行字幕（15秒内播完）
    const lines = this.ending_text(code);
    const interval = Math.max(800, Math.floor(ENDING_DURATION / Math.max(lines.length, 1)));
    lines.forEach((ln, i) => {
      setTimeout(() => {
        if (ln === "") this._emit("");
        else this._emit(`<span class="end-body">${ln}</span>`);
      }, i * interval);
    });
    // 15秒后显示报告和留话
    setTimeout(() => {
      this._emit(`<div class="report">${this.report()}</div>`);
      this._emit(`<span class="ev">（再来一局：点「换一局」；换个布局：地址栏加 ?seed=7）</span>`);
      if (DOOR_API) {
        this._emit(`<span class="ev">灯还亮着。本子合上了。</span>`);
        this._emit(`<span class="ev">后门的门缝里塞着一叠纸。你可以往里面留一句，也可以不留。</span>`);
        this._emit(`<span class="ev">（四十字以内。直接回车 = 不留。）</span>`);
        this.awaitingLeave = true;
        this.leaveDone = false;
        render(this); // 重新渲染，启用输入框进入留话模式
      }
    }, ENDING_DURATION);
  }

  // 命令解析
  play(cmd) {
    if (this.over) return;
    const s = cmd.trim();
    if (!s) return;
    const [headRaw, ...restArr] = s.split(/\s+/);
    const head = headRaw.toLowerCase();
    const rest = restArr.join(" ");
    let acted = false;
    if (head === "退" || head === "quit" || head === "q" || head === "exit") {
      this._emit(`<span class="ev">你把本子合上了。</span>`);
      this._emit(`<div class="report">${this.report()}</div>`);
      this.over = "quit";
      return;
    }
    if (head === "看" || head === "look" || head === "l") {
      this.show(true);
      return;
    }
    if (head === "门缝") {
      if (this.pos !== "2,2") {
        this._emit(`<span class="ev">只有站在后门口，才翻得到门缝里那一叠。</span>`);
      } else {
        this.showDoorHistory(10);
      }
      return;
    }
    if (ARROWS[head]) {
      acted = this.move(head);
    } else if (head === "写" || head === "write") {
      if (rest.trim()) acted = this.write(rest.trim());
      else { this._emit(`<span class="ev">写什么？写 <一句话>。</span>`); return; }
    } else if (head === "抄" || head === "copy") {
      acted = this.copy();
    } else if (head === "验" || head === "verify") {
      if (/^\d+$/.test(rest.trim())) acted = this.verify(parseInt(rest.trim()));
      else { this._emit(`<span class="ev">验 <页码>。</span>`); return; }
    } else if (head === "展开" || head === "unfold") {
      if (/^\d+$/.test(rest.trim())) acted = this.unfold(parseInt(rest.trim()));
      else { this._emit(`<span class="ev">展开 <页码>。（只有折起来的页能展开。）</span>`); return; }
    } else if (head === "没记" || head === "未定位" || head === "note") {
      if (rest.trim()) this.noteUnlocated(rest.trim());   // 免费：不花醒来，不推进回合
      else this._emit(`<span class="ev">没记 <一句话>。（记你知道、但没写下来的事。不花醒来。）</span>`);
      return;
    } else {
      this._emit(`<span class="ev">不认识。n/s/e/w 走，写 <话>，抄，验 <页码>，展开 <页码>，没记 <话>，看，门缝，退。</span>`);
      this._emit(`<span class="ev">后门要三张原话，还要你验过一页。</span>`);
      return;
    }
    if (acted) {
      this.check_end();
      if (!this.over) this.next_round();
      if (this.over === "lose") {
        this._emit(`<span class="ev">第 ${WAKES} 次醒来用完了。</span>`);
        this.finish();
      } else if (this.over === "win") {
        this.finish();
      }
    }
  }

  // 等价的 show：输出"现在看到的"+本子+（看=full）地图
  show(full) {
    const [name, desc] = ROOMS[this.pos];
    const left = WAKES - this.round + 1;
    this._emit(`<span class="sep">── 第 ${this.round}/${WAKES} 次醒来　还剩 ${left} 次 ──</span>`);
    this._emit(`<span class="here">${name}</span>　<span class="ev">${desc}</span>`);
    if (this.pos in this.hidden) {
      const piece = this.hidden[this.pos];
      this._emit(`<span class="piece">桌上有一张纸。你读了一遍，还没抄进本子：</span>`);
      this._emit(`<span class="piece">　「${piece}」</span>`);
      this._emit(`<span class="ev">（出了这间屋子就忘了。想留住它，得抄。）</span>`);
    }
    this._emit(`<span class="title">本子</span>`);
    this.pages.forEach((p, i) => {
      const tag = p.piece ? `[原话] ` : "";
      const fold = p.folded ? `（折起） ` : "";
      this._emit(`  ${i + 1}. ${fold}${tag}${p.text}`);
    });
    if (this.pieces.length > 0) {
      this._emit(`<span class="ev">已抄原话 ${this.pieces.length}/${PIECES_NEEDED}</span>`);
    }
    if (full) {
      this._emit(`<span class="title">本子背面（走过的地方）</span>`);
      this._emit(this.map_text());
      // 在后门「看」= 重读门缝最近一张
      if (this.pos === "2,2" && DOOR_API) {
        this._emit(`<span class="ev">你低头看门缝。</span>`);
        doorRead().then(line => {
          if (line) this._emit(`<span class="ev">最近塞进去的那张写着：「${escapeHtml(line)}」</span>`);
          else this._emit(`<span class="ev">空着。</span>`);
        });
      }
    }
  }

  // 把一条消息塞进日志面板
  _emit(html) {
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
}

// ── 字符串模板：把 {key} 换成 vals[key] ─────────────────
function fmt(line, vals) {
  return line.replace(/\{(\w+)\}/g, (_, k) => (vals[k] !== undefined ? String(vals[k]) : `{${k}}`));
}

// ── UI 渲染：把当前 game 状态画到右侧面板 ───────────────
// 场景 = AI 底图 + 手绘 SVG 描图纸层 + 幕叠加层
const ROOM_BG = {
  "0,0": "img/room-hall.jpg", "0,1": "img/room-corridor.jpg",
  "0,2": "img/room-attic.jpg", "1,0": "img/room-storage.jpg",
  "1,1": "img/room-living.jpg", "1,2": "img/room-study.jpg",
  "2,0": "img/room-boiler.jpg", "2,1": "img/room-kitchen.jpg",
  "2,2": "img/room-backdoor.jpg",
};
function sceneBg(pos, cls = "scene-bg") {
  const src = ROOM_BG[pos] || ROOM_BG["0,0"];
  return `<img class="${cls}" src="${src}" alt="">`;
}
function sceneSvg(pos, act) {
  return sceneBg(pos)
    + `<div class="scene-svg-wrap">` + sceneRoom(pos) + `</div>`
    + actOverlay(act, pos);
}

// 九个房间背景（严格按剧本描述）
function sceneRoom(pos) {
  switch (pos) {
    case "0,0": return roomHall();
    case "0,1": return roomCorridor();
    case "0,2": return roomAttic();
    case "1,0": return roomStorage();
    case "1,1": return roomLiving();
    case "1,2": return roomStudy();
    case "2,0": return roomBoiler();
    case "2,1": return roomKitchen();
    case "2,2": return roomBackdoor();
    default: return roomHall();
  }
}

function render(game) {
  const [name, desc] = ROOMS[game.pos];
  document.getElementById("room-name").textContent = name;
  document.getElementById("room-desc").textContent = desc;

  // 场景画布（按房间+幕切换）；结局后不覆盖结局动画
  if (!game.over) {
    const act = game.act();
    const scene = document.getElementById("scene");
    scene.className = "scene act-" + act;
    scene.innerHTML = `<span class="act-label">${actLabel(act)}</span>` + sceneSvg(game.pos, act);
  }

  // 门缝提示：到后门时在"现在"面板底部给一句
  const hint = document.getElementById("door-hint");
  if (game.pos === "2,2" && !game.over) {
    hint.innerHTML = "后门。门缝里有风——输入「门缝」可翻所有人留过的话。<br>（要联网；翻不到就开代理/VPN 再试。）";
  } else {
    hint.innerHTML = "";
  }

  const paper = document.getElementById("room-paper");
  if (game.pos in game.hidden) {
    const piece = game.hidden[game.pos];
    paper.innerHTML = `<span class="label">桌上有一张纸。你读了一遍，还没抄进本子：</span>\n　「${piece}」\n<span class="label">（出了这间屋子就忘了。想留住它，得抄。）</span>`;
  } else {
    paper.innerHTML = "";
  }

  // 本子三页卡片
  const pages = document.getElementById("notebook-pages");
  pages.innerHTML = "";
  for (let i = 0; i < PAGES; i++) {
    const p = game.pages[i];
    const div = document.createElement("div");
    if (!p) {
      div.className = "page empty";
      div.innerHTML = `<div class="no">第 ${i + 1} 页</div><div class="body">（空）</div>`;
    } else {
      let bodyClass = "body";
      let tag = "";
      if (p.folded) { bodyClass += " folded"; tag = `[折起]`; }
      else if (p.ever_folded) { bodyClass += " unfolded-scar"; tag = `[展开过]`; }
      else if (p.piece) { bodyClass += " piece"; tag = `[原话]`; }
      else if (!p.real) { bodyClass += " fake"; tag = `[墨迹新]`; }
      else if (p.ink === 0) { bodyClass += " old"; tag = `[旧墨]`; }
      else { tag = `[第${p.ink}页]`; }
      div.className = "page";
      div.innerHTML = `<div class="no">第 ${i + 1} 页</div><div class="${bodyClass}">${escapeHtml(p.text)}</div><div class="tag">${tag}</div>`;
    }
    pages.appendChild(div);
  }

  // 本子状态行
  const state = document.getElementById("notebook-state");
  state.textContent = `已抄原话 ${game.pieces.length}/${PIECES_NEEDED}`;

  // 本子背面（走过的地方）
  document.getElementById("map").innerHTML = game.map_text();

  // 顶部状态
  const left = WAKES - game.round + 1;
  document.getElementById("status").textContent = `第 ${game.round}/${WAKES} 次醒来　还剩 ${left} 次`;

  // 输入框禁用判断
  const cmd = document.getElementById("cmd");
  const canType = !game.over || game.awaitingLeave;
  cmd.disabled = !canType;
  cmd.placeholder = game.awaitingLeave
    ? "四十字以内。直接回车 = 不留。"
    : (game.pos === "2,2"
       ? "门缝 · n/s/e/w · 写 · 抄 · 验 <页码> · 展开 <页码> · 没记 · 看 · 退"
       : "n/s/e/w · 写 <一句话> · 抄 · 验 <页码> · 展开 <页码> · 没记 <一句话> · 看 · 退");
  if (canType) cmd.focus();

  // 留话阶段：快捷按钮全部禁用
  const btnsEl = document.getElementById("btns");
  if (btnsEl) {
    btnsEl.querySelectorAll("button").forEach(b => { b.disabled = !!game.awaitingLeave || !!game.over; });
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ── 门缝：读最近一张 / 翻历史 / 塞一张 ───────────────────
// 8 秒超时：后端不可达时快速失败，避免 fetch 挂一两分钟
const DOOR_TIMEOUT_MS = 8000;

async function doorRead() {
  if (!DOOR_API) return null;
  try {
    const r = await fetch(DOOR_API + "/door", { cache: "no-store", signal: AbortSignal.timeout(DOOR_TIMEOUT_MS) });
    if (!r.ok) return null;
    const j = await r.json();
    return (j && j.line) ? String(j.line) : null;
  } catch (e) {
    return null;
  }
}

// 取最近 N 条，返回 {items:[{line,ts}], count}；失败返回 null
async function doorList(n) {
  if (!DOOR_API) return null;
  try {
    const r = await fetch(`${DOOR_API}/door?list=${n}`, { cache: "no-store", signal: AbortSignal.timeout(DOOR_TIMEOUT_MS) });
    if (!r.ok) return null;
    const j = await r.json();
    return { items: Array.isArray(j.items) ? j.items : [], count: j.count | 0 };
  } catch (e) {
    return null;
  }
}

async function doorWrite(line) {
  if (!DOOR_API) return false;
  try {
    const r = await fetch(DOOR_API + "/door", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line }),
      signal: AbortSignal.timeout(DOOR_TIMEOUT_MS),
    });
    return r.ok;
  } catch (e) {
    return false;
  }
}

// ── 启动 ────────────────────────────────────────────────
const STORE_KEY = "benzi-p0-state";

function newGame(seed) {
  const game = new BenziGame(seed);
  save(game);
  // 开局公告
  game._emit(`<span class="sep">${"═".repeat(46)}</span>`);
  game._emit(`<span class="title">　　本　　子</span>`);
  game._emit(`<span class="ev">${WAKES} 次醒来。三页纸。三张原话。</span>`);
  game._emit(`<span class="ev">走一步、写一句、抄一句、验一页、展开一页，各花掉一次醒来。看和没记，不花。</span>`);
  game._emit(`<span class="ev">后门有条缝。走到后门，输入「门缝」，能看见所有人在这条缝里留过的话。</span>`);
  game._emit(`<span class="ev">（门缝连着门外很远的邮筒，要联网；国内网络通常先开代理/VPN 才能用。翻不到不是门坏了。）</span>`);
  game._emit(`<span class="sep">${"═".repeat(46)}</span>`);
  // 第一次 show
  game.show(false);
  render(game);
  return game;
}

// 存档：写 localStorage；失败（无痕/配额满）时在界面上说一声，不静默吞掉
function save(g) {
  const ok = persist(g);
  const el = document.getElementById("save-state");
  if (!el) return;
  if (ok) {
    el.textContent = "已自动保存";
    el.title = "这一局存在这台设备这个浏览器里";
  } else {
    el.textContent = "存不上（这个浏览器不让写本地存档）";
    el.title = "无痕模式或禁用了本地存储";
  }
}

function persist(g) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(serialize(g)));
    return true;
  } catch (e) {
    return false;
  }
}

function clearSave() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}

function serialize(g) {
  return {
    seed: g.seed,
    round: g.round,
    pos: g.pos,
    visited: [...g.visited],
    map_shown: g.map_shown,
    pages: g.pages,
    pieces: g.pieces,
    piece_ids: g.piece_ids,
    own_evicted: g.own_evicted,
    fake_pool: g.fake_pool,
    hidden: g.hidden,
    over: g.over,
    hinted: g.hinted,
    door_hint: g.door_hint,
    log: g.log,
    door_reached: g.door_reached,
    door_letter: g.door_letter,
    door_read: g.door_read,
    wake_marks: g.wake_marks,
    unlocated: g.unlocated,
    door_seen: g.door_seen,
    _start: g._start,
    savedAt: Date.now(),
  };
}

function deserialize(obj) {
  const g = Object.create(BenziGame.prototype);
  Object.assign(g, obj);
  g.visited = new Set(obj.visited);
  g.rng = new Rng(obj.seed);
  g.door_seen = !!obj.door_seen;
  g.awaitingLeave = false;
  g.leaveDone = false;
  return g;
}

function loadGame() {
  const raw = localStorage.getItem(STORE_KEY);
  if (!raw) return null;
  try {
    const obj = JSON.parse(raw);
    if (!obj || !obj.pages) return null;
    return deserialize(obj);
  } catch (e) {
    return null;
  }
}

// 解析 ?seed=N
function getSeedFromUrl() {
  const m = new URLSearchParams(location.search).get("seed");
  if (m == null) return null;
  const n = parseInt(m, 10);
  return Number.isFinite(n) ? n : null;
}

let game = null;
(function init() {
  const restored = loadGame();
  if (restored && !restored.over) {
    game = restored;
    const d = restored.savedAt ? new Date(restored.savedAt) : null;
    const when = d
      ? `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`
      : "";
    game._emit(`<span class="ev">（接着上一局。${when ? when + " 存的，" : ""}第 ${game.round}/${WAKES} 次醒来。）</span>`);
    game.show(false);
  } else {
    clearSave();
    game = newGame(getSeedFromUrl());
  }
  render(game);
  save(game);
})();

// 命令输入
const cmdInput = document.getElementById("cmd");
cmdInput.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const v = cmdInput.value;
  // 结局之后：输入框改成留话，空回车 = 不留
  if (game.awaitingLeave) {
    cmdInput.value = "";
    game.submitLeave(v);
    render(game);
    return;
  }
  if (!v.trim()) return;
  cmdInput.value = "";
  game.play(v);
  if (game.over) clearSave();
  else save(game);
  render(game);
});

// 快捷按钮（「写/验」要带参数，仍须打字）
const BTN_CMDS = ["n", "s", "e", "w", "抄", "看", "退"];
const btns = document.getElementById("btns");
BTN_CMDS.forEach(c => {
  const b = document.createElement("button");
  b.textContent = c;
  b.addEventListener("click", () => {
    if (game.over) return;
    game.play(c);
    if (game.over) clearSave();
    else save(game);
    render(game);
    cmdInput.focus();
  });
  btns.appendChild(b);
});

// 换一局 / 用法
document.getElementById("act-restart").addEventListener("click", () => {
  if (!confirm("开新的一局？当前这一局的进度不会保留。")) return;
  clearSave();
  document.getElementById("log").innerHTML = "";
  game = newGame(getSeedFromUrl());
  render(game);
});
document.getElementById("act-help").addEventListener("click", () => {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.innerHTML = `<span class="ev">
动作：
  n/s/e/w 或 北/南/东/西   走一步（花一次醒来）
  写 &lt;一句话&gt;            写进本子（最多 60 字；满页挤掉最旧的非原话）
  抄                       把面前的原话抄进本子
  验 &lt;页码&gt;                验那页的墨迹是谁的（假页会被撕掉，腾一页）
  展开 &lt;页码&gt;              把折起来的页抹开（花一次醒来；折痕留着，这页之后能验）
  没记 &lt;一句话&gt;            记下「知道但没写」的事（不花醒来，不占页；最多五条）
  看                       看屋里和本子（不花醒来）；在后门可重读门缝
  门缝                     在后门翻最近的十条留话
  退                       合上本子，结束本局

本子会自己折页：第 4、8、12 次醒来之后，最旧的一页非原话被对折，
只剩开头十二个字的大意。折起的页验不了；原话永不折。

后门在东北角，要三张原话，还要你亲手验过一页墨迹。
十三次醒来。用完了不是死，是这一天到此为止。

门缝：所有玩过的人共用的投递口。一局结束可以留一句话（最多 40 字），
走到后门能抽到最近塞进去的那张；输入「门缝」能往前翻。门缝里的话不归你管，
也可能是别人留的。
注意：门缝要联网（服务器在境外），国内网络通常需要开代理/VPN 才能读到或塞进；
显示「门缝现在不通 / 塞不进去」多半是网络问题，不是坏了。</span>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
});
</script>
